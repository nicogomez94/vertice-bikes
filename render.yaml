services:
  - type: web
    name: vertice-bikes
    runtime: static
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    buildCommand: ""
    headers:
      - path: /*
        name: Cache-Control
        value: "public, max-age=3600"
      - path: /*.css
        name: Cache-Control
        value: "public, max-age=86400"
      - path: /*.js
        name: Cache-Control
        value: "public, max-age=86400"
